services:
  downloader:
    build: .
    volumes:
      - .:/workspace
    environment:
      ARCHIVE_PATH: /workspace/Archive
      THRESHOLD_SECONDS: "1.0"
      JITTER_SECONDS: "0.5"
      WORKERS: "3"
      LOG_LEVEL: INFO

  gallery-update:
    build: .
    entrypoint: ["./gallery", "-archive", "/workspace/Archive"]
    volumes:
      - .:/workspace
